# Single-machine profile (workstation or server without a job scheduler); Chinese version: config.yaml
# (same settings - keep both in sync). Snakemake reads config.yaml; to use this file, copy it over config.yaml.
#   Run: snakemake --configfile config/config.yaml --profile profiles/local
snakefile: workflow/Snakefile
cores: all                        # use all CPUs of the machine; or a number, e.g. 32
# Optional: global memory limit (MB). The memory of jobs running at the same time (resources.*.mem_mb in
# config.yaml) never exceeds it, so two memory-heavy jobs (EDTA, BRAKER4, OMArk ...) do not run together and
# exhaust the RAM. About 90% of the physical memory is a good value.
# resources:
#   - mem_mb=120000
printshellcmds: true
rerun-incomplete: true
latency-wait: 30                  # seconds to wait for output files (local disks need little)
keep-going: false                 # true = after a failed step, continue with steps that do not depend on it
# threads / mem_mb of each step come from the resources section of config.yaml; runtime has no effect locally.
# BRAKER4 runs as a nested Snakemake: keep braker4.executor: local in config.yaml.

# ---------- software environments ----------
# Snakemake builds the conda environment of each step from workflow/envs/*.yaml (pinned versions).
# BRAKER4's software is in its official containers, which BRAKER4 runs with Apptainer itself; apptainer is not
# needed here.
software-deployment-method: [conda]

# Directory of the conda environments:
#   1. needs about 15-20 GB (13 environments);
#   2. can be shared by projects and runs: environments are named by a hash of the yaml content and of the real
#      path of this directory, so an unchanged yaml is reused, not reinstalled; using the same directory as the
#      SLURM profile lets both share one set of environments.
# Without this setting environments go to <working directory>/.snakemake/conda, one copy per result directory.
# To build the environments only, without running the workflow:
#   snakemake --configfile config/config.yaml --profile profiles/local --conda-create-envs-only
conda-prefix: ~/annotation_conda_envs

# Snakemake 8.18.2 creates environments with "mamba env create --no-default-packages", which mamba 2.x rejects -> conda
conda-frontend: conda
