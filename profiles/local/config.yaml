# 单机 profile（工作站或不用作业调度的服务器）；英文版：config.en.yaml（参数相同，修改时请同步）
#   运行：snakemake --configfile config/config.yaml --profile profiles/local
snakefile: workflow/Snakefile
cores: all                        # 使用本机全部 CPU；可改成具体数字，如 32
# 可选：全局内存上限（MB）。设置后，同时运行的任务内存（config.yaml 的 resources.*.mem_mb）之和不会超过它，
# 避免两个大内存任务（EDTA、BRAKER4、OMArk 等）同时运行导致内存不足。建议设为物理内存的 90% 左右。
# resources:
#   - mem_mb=120000
printshellcmds: true
rerun-incomplete: true
latency-wait: 30                  # 输出文件出现的等待秒数（本地磁盘无需太长）
keep-going: false                 # true = 某一步失败后继续运行不依赖它的步骤
# 各步骤的 threads / mem_mb 来自 config.yaml 的 resources 段；单机运行时 runtime 不起作用。
# BRAKER4 以嵌套 Snakemake 运行，保持 config.yaml 中 braker4.executor: local。

# ---------- 软件环境 ----------
# 各步骤的软件由 Snakemake 按 workflow/envs/*.yaml（版本已锁定）自动建立 conda 环境。
# BRAKER4 的软件在其官方容器中，由 BRAKER4 自己调用 Apptainer，这里不需要开启 apptainer。
software-deployment-method: [conda]

# conda 环境的存放目录：
#   1. 需要约 15–20 GB 空间（13 个环境）；
#   2. 多个项目/多次运行可以共用：环境按 yaml 内容和该目录真实路径的哈希命名，yaml 不变就直接复用，不会重复安装；
#      与 SLURM profile 使用同一目录时，两种运行方式共用一套环境。
# 不设置时默认放在 <工作目录>/.snakemake/conda，每个结果目录各装一份。
# 只想预先建好环境、不运行流程：
#   snakemake --configfile config/config.yaml --profile profiles/local --conda-create-envs-only
conda-prefix: ~/annotation_conda_envs

# Snakemake 8.18.2 建环境时调用 "mamba env create --no-default-packages"，mamba 2.x 不支持该参数 -> 用 conda
conda-frontend: conda
