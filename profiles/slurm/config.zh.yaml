# SLURM 集群 profile。中文注释版，参数与 config.yaml（英文注释，Snakemake 实际读取的文件）相同，修改时请同步；
# 想用中文注释版时把本文件复制为 config.yaml
#   运行：snakemake -s <代码目录>/workflow/Snakefile -d <分析目录> --configfile <分析目录>/config.yaml --profile <代码目录>/profiles/slurm
#   需要 snakemake-executor-plugin-slurm 2.6.0（装在启动流程的环境中；嵌套运行的 BRAKER4 也使用它）
snakefile: workflow/Snakefile
executor: slurm
jobs: 100                         # 同时排队/运行的作业数上限
printshellcmds: true
rerun-incomplete: true
latency-wait: 120                 # 共享文件系统上输出文件可能延迟出现，等待秒数
restart-times: 1
# 文本值要在双引号里再加单引号（"'名称'"）：Snakemake 把这里的每个值当作 Python 表达式求值，不加单引号时
# all、max、input 这类名称会变成 Python 对象，作业随即失败。
default-resources:
  slurm_partition: "'all'"        # 改成你所在集群的分区（两层引号都保留）
  # slurm_account: "'my_account'" # 集群要求记账账户时填写
  mem_mb: 8000                    # 单位 MB，只能写整数：这里写 mem: "8G" 会覆盖所有步骤自己的内存，
                                  #   写 mem_mb: "8G" 则 SLURM 插件无法识别（Snakemake 8.18 / 插件 2.6）
  runtime: "10h"                  # 分钟，或 "10h"、"2d" 这样的时长
# 这些默认值只用于没有单独设置的步骤：各步骤的 threads / mem / runtime 来自 config.yaml 的 resources 段
# （那里可以写 mem: 16G）。
# BRAKER4 以嵌套 Snakemake 运行：在 config.yaml 中设置 braker4.executor: slurm，它内部的步骤才会提交到 SLURM。

# ---------- 软件环境 ----------
# 各步骤的软件由 Snakemake 按 workflow/envs/*.yaml（版本已锁定）自动建立 conda 环境。
# BRAKER4 的软件在其官方容器中，由 BRAKER4 自己调用 Apptainer，这里不需要开启 apptainer。
software-deployment-method: [conda]

# conda 环境的存放目录。必须满足：
#   1. 在共享文件系统上，登录节点和所有计算节点用同一路径都能访问（不要用 /tmp 或节点本地盘）；
#   2. 空间约 15 GB（默认 7 个环境，启用 Merqury 等可选功能时会多建几个）；
#   3. 多个项目/多次运行可以共用：环境按 yaml 内容和该目录真实路径的哈希命名，yaml 不变就直接复用，不会重复安装。
# 计算节点不能联网时，先在登录节点建好全部环境：
#   snakemake -s <代码目录>/workflow/Snakefile -d <分析目录> --configfile <分析目录>/config.yaml --profile <代码目录>/profiles/slurm --conda-create-envs-only
# 不设置时默认放在 <工作目录>/.snakemake/conda，每个结果目录各装一份。
conda-prefix: ~/annotation_conda_envs   # 家目录在多数集群上是共享的；家目录空间不足时改到 /shared/... 下

# Snakemake 8.18.2 建环境时调用 "mamba env create --no-default-packages"，mamba 2.x 不支持该参数 -> 用 conda
conda-frontend: conda
