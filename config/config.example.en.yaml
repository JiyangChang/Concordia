# Concordia genome annotation workflow - example configuration (Chinese version: config/config.example.yaml;
# both files hold the same parameters - keep them in sync when editing)
outdir: "results"                # 00_Data ... 07_Report are created under this directory
species_prefix: "ABCD"           # prefix of the final gene IDs
genome: "data/genome.fa"
max_intron: 50000                # plants 2e4-5e4; vertebrates may use 5e5
min_contig_len: 1000

rename_seqids:
  # EDTA requires sequence names of <= 13 characters containing only letters / digits / underscores.
  # If any name is longer than 13 characters, the whole genome is renamed to seq0001...;
  # the mapping is written to 00_Data/genome/seqid_map.tsv and the original names are restored in the
  # final results. Nothing is renamed when all names are valid.
  max_len: 13
  prefix: "seq"
  on_invalid_chars: true         # also rename when names contain invalid characters; false = stop with an error

assembly_qc:
  # Genome assembly quality assessment (results in 00_Data/qc/, summary table 00_Data/qc/assembly_quality.tsv)
  # Default items: contiguity (scaffold and contig level), BUSCO genome mode (qc.busco_lineages), telomeres
  # All results appear in the "genome assembly quality" section of 07_Report/annotation_report.html
  gap_min_n: 10                  # runs of >= this many N are gaps; scaffolds are split into contigs there
  # LAI (LTR Assembly Index, Ou et al. 2018, NAR 46:e126): computed from EDTA's intact LTRs and the
  #   whole-genome RepeatMasker output, after EDTA has finished (the 00_Data summary waits for it).
  #   Reference: draft < 10, reference 10-20, gold >= 20.
  #   LAI is not applicable when LTR retrotransposons cover < 5% of the genome; the report then shows
  #   "not applicable" with the reason.
  lai: true
  lai_mono: false                # true for recent polyploids (LAI -mono): avoids homeologous LTR copies lowering LAI
  merqury:                       # k-mer based QV and completeness; skipped when reads is empty
    reads: []                    # WGS reads of the target species (Illumina or HiFi) - not RNA-seq
    k: 21                        # can be estimated with $MERQURY/best_k.sh <genome size>
  telomere:                      # tidk telomere detection (on by default)
    enabled: true
    motif: TTTAGGG               # default TTTAGGG (most plants); e.g. TTAGGG for vertebrates, TTAGG for most insects
    window: 10000                # window size (bp)
    min_repeats: 50              # a sequence end has a telomere if its first/last window has >= this many repeats (empirical)
  fcs_gx:                        # NCBI FCS-GX contamination screen; skipped when db or tax_id is empty
    db: null                     # gxdb path, e.g. /data/gxdb/all (about 470 GB; /dev/shm recommended)
    tax_id: null                 # NCBI taxonomy ID of the target species
    cmd: "run_gx.py"             # bioconda ncbi-fcs-gx; or "python3 /path/fcs.py screen genome" (official container)
    # Report only: no sequence is removed automatically; cleaning is up to the user

rna:
  short: "rna_short.tsv"          # relative paths are relative to the working (analysis) directory; copy from <code dir>/config/rna_short.example.tsv
  long:  "rna_long.tsv"           # copy from <code dir>/config/rna_long.example.tsv and fill in
  # platform values: pacbio_isoseq | pacbio_hifi | ont_cdna | ont_drna
  #   PacBio: minimap2 -ax splice:hq -uf; used by BRAKER4 (isoseq_bam), EviAnn, EVM
  #   ONT   : minimap2 -ax splice (drna adds -uf -k14); not used by BRAKER4, only by EviAnn, EVM, refine
  #   EviAnn tag: short + long = bam_mix; short only = bam; long only (PacBio or ONT) = bam_isoseq (provisional for ONT)
  allow_none: false              # true = allow no RNA-seq at all (set short and long to null). BRAKER4 then runs in EP mode
                                 #   (proteins only), EviAnn / StringTie are not run, GeMoMa uses no RNA splice evidence;
                                 #   EVM integrates BRAKER4, GeMoMa and miniprot only; refinement checks every locus as R5
                                 #   (protein / BRAKER4 evidence); the final filter uses protein evidence instead of RNA.
                                 #   No UTRs, alternative isoforms or lncRNAs. With false, missing RNA samples are an error
                                 #   (protects against a forgotten sample table).

homologs: "homologs.tsv"         # copy from <code dir>/config/homologs.example.tsv and fill in
homolog_protein_coding_only: true   # keep only protein-coding genes of the homologs (drop TE genes, pseudogenes,
                                    #   ncRNA genes and transcripts without CDS)
orthodb_proteins: "db/Viridiplantae.fa"   # OrthoDB proteins of a BRAKER partition (.gz allowed); used by BRAKER4 only

# Optional: use only the OrthoDB proteins of selected taxonomic levels (extracted on every run by
# workflow/scripts/orthodb_subset.py into 00_Data/protein_db/orthodb_subset.faa). BRAKER4 copies the
# protein database about 3 times and writes ProtHint temporary files: the full plant partition
# (11.35 M proteins, 5.4 GB) needs about 20 GB of disk. Use a subset when disk is tight or only
# related proteins are wanted.
# levels: OrthoDB level names or NCBI taxids, several allowed (union); [] = the whole partition.
# Levels available in the Viridiplantae partition (OrthoDB v12: species / proteins):
#   Embryophyta 365 / 10.8 M      eudicotyledons 266 / 7.8 M    Liliopsida 62 / 1.9 M
#   Chlorophyta 43 / 0.40 M       Poales 40 / 1.35 M            Fabales 35 / 1.06 M
#   Malvales 29 / 0.99 M          Solanales 25 / 0.60 M         Brassicales 25 / 0.92 M
#   Malpighiales 22 / 0.58 M      Lamiales 20 / 0.52 M          Rosales 20 / 0.47 M
#   Rosaceae 14 / 0.35 M          Chlorophyceae 21 / 0.24 M     Trebouxiophyceae 12 / 0.09 M
# Full list (with the species actually present in the FASTA): python workflow/scripts/orthodb_subset.py --list \
#   --fasta <orthodb_proteins> --levels <levels_tab> --level2species <level2species_tab>
# Suggestion: the order of the target species + 1-2 related orders
#   (e.g. Moringa, Moringaceae, belongs to Brassicales: [Brassicales, Malvales]).
# Both tables are downloaded by the orthodb_levels step of scripts/download_databases.sh
#   (https://data.orthodb.org/v12/download/odb_data_dump/).
orthodb_subset:
  levels: []
  levels_tab: "db/orthodb/odb12v2_levels.tab.gz"
  level2species_tab: "db/orthodb/odb12v2_level2species.tab.gz"

repeat:
  edta_sensitive: 1              # 1: also run RepeatModeler; 0: faster
  edta_cds: null                 # optional: CDS nucleotide FASTA for EDTA --cds (target or related species), used to
                                 #   remove gene fragments from the TE library; not given by default.
                                 #   Note: EDTA expects coding DNA sequences only (not proteins)
  dfam_dir: "db/dfam"   # directory with the Dfam FamDB root partition (dfam40.0.h5); RepeatMasker 4.2 needs it
                        #   even with a custom library
  rm_nolow: false                # true: RepeatMasker -nolow, mask TEs only
  # edta_u: neutral mutation rate (substitutions / site / year), used by EDTA for intact-LTR insertion times
  #   T = K / (2u), K = divergence between the two LTRs (Kimura 2-parameter corrected)
  #   null  -> -u is not passed; EDTA's default 1.3e-8 (rice) is used
  #            Source: Ma J. & Bennetzen J.L. (2004) Rapid recent growth and divergence
  #            of rice nuclear genomes. PNAS 101:12404-12410. doi:10.1073/pnas.0403715101
  #   Own estimate: with a known synonymous substitution rate r_syn of the target clade, following the paper
  #            ("intergenic rate is about twice the synonymous rate") use u ≈ 2 × r_syn
  #   Affects LTR age estimates only, not the TE library or masking
  edta_u: null

braker4:
  repo: "external/BRAKER4"      # relative paths are resolved against the project directory
  container_cache: ".singularity_cache"
  bind: "/home,/scratch"
  min_contig: 10000              # BRAKER4 default; shorter contigs are not predicted
  use_minisplice: false          # only effective with IsoSeq data
  skip_busco: true               # BUSCO / OMArk are run by this workflow for all sources (only disables BRAKER4's own
                                 #   assessment; the compleasm it uses for prediction still runs, sharing qc.busco_download_path)
  run_omark: false
  executor: local                # local | slurm: executor of the nested BRAKER4 run (slurm with the SLURM profile)
  max_jobs: 50                   # maximum concurrent SLURM jobs of the nested run
  slurm:
    default_resources:           # passed to the nested BRAKER4 as --default-resources
      slurm_partition: all
  # Mode chosen from the data: short + PacBio = dual, short (+ONT) = ETP, PacBio only = IsoSeq,
  #   ONT only = EP, no RNA (rna.allow_none) = EP

eviann:
  # EviAnn annotates from RNA data only (short + long reads), but needs a protein set to decide CDSs:
  #   swissprot set → UniProt-SwissProt (-s, a generic protein set; homolog data are not used)
  #   null          → falls back to the homolog proteins (-p 00_Data/protein_db/homolog_proteins.faa)
  # Download: swissprot step of scripts/download_databases.sh (databases/uniprot/uniprot_sprot.fasta)
  swissprot: null

gemoma:
  # GeMoMaPipeline runs once per homologous species (04_Homology/GeMoMa/<species>/); RNA evidence (ERE)
  # is extracted once. The per-species results are merged with GeMoMa GAF + AnnotationFinalizer into
  # 04_Homology/gemoma.gff3, which goes to EVM.
  # miniprot is also run per species (04_Homology/miniprot/species/); the merged alignments are EVM's PROTEIN evidence.
  # The species can run in parallel, each with one resources.gemoma; on a single machine set a global
  # mem_mb limit in the profile.
  # GeMoMa command prefix; {mem_gb} is replaced by the JVM memory derived from resources.gemoma.mem_mb
  #   bioconda wrapper (verified for gemoma 1.9: the wrapper adds CLI itself, do not add it): "GeMoMa -Xmx{mem_gb}g"
  #   jar file directly (CLI needed): "java -Xmx{mem_gb}g -jar /path/GeMoMa-1.9.jar CLI"
  cmd: "GeMoMa -Xmx{mem_gb}g"
  ere_long_reads: false          # experimental: use the long-read BAM for ERE when there are no short reads

evm:
  # standard: EVidenceModeler v2.1.0 (default, supports --repeats / --CPU)
  # rust    : hyphaltip/EVidenceModeler_rust; --help is checked for --repeats before running;
  #           if the check fails or is inconclusive, standard is used and noted in 05_EVM/logs/evm_impl_check.txt
  implementation: "standard"
  rust_repo: "external/EVidenceModeler_rust"
  segment_size: 500000           # < 1 Mb
  overlap_size: null             # null: derived from max_intron (at least 1-2 gene lengths)
  tune:                          # weight tuning: grid search on one sequence; the best weights are used genome-wide
    enabled: true
    region: auto                 # auto = longest sequence; or an original sequence name, e.g. Chr1
    use_best: true               # false: only report the tuning results; the genome-wide run uses the weights below
    grid:                        # candidate weights per source; transcripts = the transcript evidence actually
                                 #   produced (LR_ or SR_stringtie)
      BRAKER4: [1, 2]
      GeMoMa: [3, 5]
      EviAnn: [5, 10]
      miniprot: [2]
      transcripts: [5, 10]
    # Score: P = fraction of multi-exon models whose CDS intron chain is fully confirmed by any evidence
    #        (long reads; without long reads, short reads with the A/B/C criteria of refine; miniprot alignments);
    #        R = fraction of long-read loci and high-identity protein alignment loci covered
    #        (miniprot only without RNA); the highest F = 2PR/(P+R) wins. miniprot and transcripts are also
    #        EVM inputs, so the score slightly favours these two evidence types.
  weights:                       # baseline weights (c00 of the tuning; used directly when tuning is off or use_best: false)
    ABINITIO_PREDICTION: {BRAKER4: 2}
    OTHER_PREDICTION:    {GeMoMa: 5, EviAnn: 8}
    PROTEIN:             {miniprot: 3}
    TRANSCRIPT:          {LR_stringtie: 10, SR_stringtie: 6}   # short-read StringTie assembly when there are no long reads

refine:
  # 05_EVM/refine: EVM vs EviAnn models compared by CDS intron chain (rules R1-R6, see workflow/scripts/refine.py)
  min_cds_aa: 50                 # EviAnn models used by R2/R3/R4 need a complete ORF of at least this length;
                                 #   also used by the final filter
  # Final filter: a gene is removed only if > max_te_overlap of its CDS is covered by EDTA TEs AND it has no RNA evidence
  #   RNA evidence (any): exon overlap with a StringTie transcript / from or identical to EviAnn /
  #     RNA support in BRAKER4 gene_support (without RNA-seq: protein evidence from miniprot / GeMoMa instead)
  #   TEsorter hits are only recorded in 05_EVM/final/filter_decisions.tsv, never a removal criterion
  #   R2 also requires CDS-TE overlap <= this value when adding EviAnn genes
  max_te_overlap: 0.5
  min_lr_support: 2              # R3/R4: an intron chain is "supported" when at least this many (full-length)
                                 #   long reads match it exactly
                                 #   Full-length read counts come from (in order): the counts column of rna_long.tsv
                                 #   (isoseq cluster's cluster_report.csv / isoseq collapse's flnc_count.txt) > the
                                 #   full_length_coverage header tag > 1 per record. Iso-Seq HQ transcripts with neither
                                 #   count as 1 each and support is underestimated: then set this to 1 (any HQ transcript
                                 #   counts as support); the report section on long-read weights warns about it
  lr_weight_by_coverage: true    # weight long reads by full_length_coverage from the FASTA/FASTQ header (an Iso-Seq
                                 #   HQ/LQ transcript is the consensus of a cluster of full-length reads); raw reads
                                 #   without the field (FLNC, ONT) count 1.
                                 #   Note: an HQ transcript has >= 2 full-length reads, so min_lr_support: 2 = any HQ transcript
  single_exon_overlap: 0.5       # single-exon models: minimum fraction of the model covered by an unspliced long read
  # Short-read support when there are no long reads (not used with long reads):
  #   B every intron has >= min_sr_junction_reads junction reads and >= sr_min_junction_ratio x the strongest
  #     overlapping (competing) intron
  #   A a StringTie transcript (short-read assembly, cov >= sr_stringtie_min_cov) has exactly the model's intron
  #     chain within the model span
  #   C single-exon model: a single-exon StringTie transcript (cov passing) covers >= single_exon_overlap of it,
  #     and no passing junction lies inside the model
  #   1 intron: B; >= 2 introns: A and B; single exon: C. EVM weight tuning uses the same criteria.
  sr_junction_fallback: true     # false = do not use short reads for support when there are no long reads
  min_sr_junction_reads: 3
  sr_min_junction_ratio: 0.1
  sr_stringtie_min_cov: 3
  import_utr_isoforms: true      # R1: import UTRs and other complete isoforms from EviAnn
  remove_unsupported_evm: false  # R5: delete EVM genes without any evidence (default: keep, flag refine_support=none)

naming:
  # Final gene names (05_EVM/final); old -> new ID table 05_EVM/final/id_map.tsv
  #   coding genes <species_prefix><chromosome>G<number>, e.g. Mol01G000010; lncRNAs use L, e.g. Mol01L000010
  #   transcripts <gene>.1, .2 ... (.1 = longest CDS)
  scheme: chromosome             # chromosome: numbered per chromosome; sequential: genome-wide (<prefix>G000010)
  step: 10                       # numbering step, leaves room for inserting genes later
  digits: 6                      # number of digits
  chrom_regex: '^(?:chr(?:omosome)?)?[_-]?0*(\d+)$'   # chromosome number from the original name: Chr1 / chr01 / Chromosome_3 / 1
  unplaced_code: "00"            # code for sequences not matched (scaffolds, contigs), numbered in genome order
  chrom_codes: {}                # explicit codes, e.g. {ChrM: Mt, ChrC: Pt} (take precedence over chrom_regex)
  coding_tag: G
  lncrna_tag: L

qc:
  busco_lineages: []             # required, set by the user, e.g. [eudicots_odb12, embryophyta_odb12]; empty = error
  busco_download_path: null      # pre-downloaded lineage directory (offline use)
  reference_gff: null   # optional: existing reference annotation (original sequence names); CDS-level agreement
                        #   with every annotation source, shown in the report
  # OMAmer database (for OMArk):
  #   LUCA.h5          9.9 GB, needs about 12 GB RAM (resources.omark.mem_mb at least 14000); recommended,
  #                    detects contamination from any lineage
  #   Viridiplantae.h5 1.5 GB, needs about 2 GB RAM; for plants on machines with < 16 GB RAM: completeness /
  #                    consistency unaffected, but only plant contamination is detected.
  #                    Both are downloaded by scripts/download_databases.sh (omamer / omamer_plants)
  omark_db: "db/LUCA.h5"
  per_homolog: true              # also run BUSCO + OMArk + AGAT on each homolog's GeMoMa set (one more set per species)

function:
  interproscan_dir: "/path/to/interproscan-5.7x"
  interproscan_appl: null        # null = all member databases; or "Pfam,PANTHER,..."
  eggnog_data_dir: "/path/to/eggnog_data"
  eggnog_tax_scope: "auto"
  chunks: 20
  go_obo: null                   # optional: GO ontology go-basic.obo (https://purl.obolibrary.org/obo/go/go-basic.obo);
                                 #   the report then shows GO names and BP/MF/CC statistics
  report_top: 20                 # number of top Pfam / InterPro / GO / KEGG pathways listed in the report
  kegg_pathway_names: download   # KEGG pathway names: download = fetched at run time from https://rest.kegg.jp/list/pathway
                                 #   (KEGG REST is for academic use only); or a pre-downloaded file; null = no names

# Resources per task class (default applies to tasks not listed)
#   threads : number of threads (never more than --cores when running locally)
#   mem_mb  : memory in MB (16000 = about 16 GB)
#   runtime : maximum run time in minutes (720 = 12 hours, 10080 = 7 days)
# Use: on SLURM they become --cpus-per-task / --mem / --time; jobs exceeding time or memory are killed by the scheduler.
#   Locally they are only used for scheduling (with a global mem_mb limit in the profile, the memory of jobs running
#   at the same time never exceeds it); processes are not limited or killed, and runtime has no effect.
#   A few tools use the values directly: GeMoMa JVM -Xmx = mem_mb/1000 - 2 GB, Merqury (meryl) memory =
#   mem_mb/1000 - 4 GB, BRAKER4 config.ini (cpus_per_task / mem_of_node / max_runtime).
resources:
  default:      {threads: 8,  mem_mb: 16000,  runtime: 720}
  edta:         {threads: 48, mem_mb: 128000, runtime: 10080}
  braker4:      {threads: 48, mem_mb: 128000, runtime: 4320}
  eviann:       {threads: 32, mem_mb: 64000,  runtime: 2880}
  gemoma:       {threads: 32, mem_mb: 64000,  runtime: 2880}
  evm:          {threads: 32, mem_mb: 32000,  runtime: 1440}
  repeatmasker: {threads: 32, mem_mb: 32000,  runtime: 2880}
  refine:       {threads: 1,  mem_mb: 16000,  runtime: 720}
  interproscan: {threads: 16, mem_mb: 32000,  runtime: 1440}
  eggnog:       {threads: 32, mem_mb: 64000,  runtime: 1440}
  busco:        {threads: 16, mem_mb: 32000,  runtime: 720}
  omark:        {threads: 8,  mem_mb: 16000,  runtime: 720}
  merqury:      {threads: 16, mem_mb: 64000,  runtime: 1440}
  fcs_gx:       {threads: 48, mem_mb: 512000, runtime: 1440}
